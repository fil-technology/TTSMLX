name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  swift-package:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # mlx-audio-swift names upstream ml-explore/mlx-swift, so without the
      # mirror SwiftPM resolves the shared identity to upstream — an app
      # without the Metal-in-background crash fix. The mirror in
      # .swiftpm/configuration/mirrors.json is tracked; installing it here is
      # idempotent insurance against it going missing, and the verify step
      # turns silent drift into a hard failure. (macos-26: mlx-swift 0.33
      # needs the Swift 6.3 toolchain, which the macos-15 image lacks.)
      - name: Install mlx-swift mirror
        run: Tools/install-mirrors.sh

      - name: Resolve package
        run: swift package resolve

      - name: Verify mlx-swift is the background-safe fork
        run: Tools/verify-mlx-fork.sh

      # A consumer with no mirror must still get the fork: mlx-audio-swift
      # names it itself since 0.1.8-tts.5.
      - name: Verify a mirror-less consumer resolves the fork
        run: Tools/verify-consumer-resolution.sh

      - name: Build package
        run: swift build

      - name: Test package
        run: swift test

  demo-project:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate demo project
        working-directory: DemoApp
        run: xcodegen generate
